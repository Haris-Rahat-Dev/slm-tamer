[project]
name = "slmtamer"
version = "0.1.0"
description = "slm-tamer core daemon: HF hub + LoRA training jobs"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "huggingface-hub>=0.30",
    "httpx>=0.27",
    "pydantic>=2",
    "mlx-lm>=0.20; sys_platform=='darwin' and platform_machine=='arm64'",
    "gguf>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slmtamer"]
